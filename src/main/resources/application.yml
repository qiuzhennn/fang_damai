app:
  admin-bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  rabbitmq:
    init-on-startup: ${RABBITMQ_INIT_ON_STARTUP:false}

  order:
    relay:
      enabled: ${ORDER_RELAY_ENABLED:true}
      poll-ms: 100

    consumer:
      enabled: ${ORDER_CONSUMER_ENABLED:true}
    recovery:
      enabled: ${ORDER_RECOVERY_ENABLED:false}
    rate-limit:
      # 同一用户最多积累3次进入额度，每秒补充1次。
      user-capacity: ${ORDER_RATE_USER_CAPACITY:3}
      user-refill-per-second: ${ORDER_RATE_USER_REFILL:1}

      # 所有用户共同竞争同一个票档的额度。
      ticket-capacity: ${ORDER_RATE_TICKET_CAPACITY:100}
      ticket-refill-per-second: ${ORDER_RATE_TICKET_REFILL:100}





spring:
  application:
    name: fang-damai

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:damai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      # 每次创建数据库连接时，将该连接的会话时区设置为北京时间
      connection-init-sql: "SET time_zone = '+08:00'"

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  session:
    # 连续30分钟没有使用该会话的请求，登录状态失效
    timeout: "${SESSION_TIMEOUT:30m}"

    data:
      redis:
        # 登录会话写入Redis
        namespace: fang-damai:session

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:damai}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    # 演出、场次相关SQL
    com.example.damai.modules.program.mapper: DEBUG

    # 票档、库存相关SQL
    com.example.damai.modules.ticket.mapper: DEBUG

    # 订单相关SQL
    com.example.damai.modules.order.mapper: DEBUG

    # 单独隐藏每10秒扫描超时订单的SQL
    com.example.damai.modules.order.mapper.TicketOrderMapper.selectExpiredIds: INFO
    com.example.damai.modules.ticket.mapper.StockReleaseTaskMapper.selectPendingIds: INFO
